name: Auto Update JSON

on:
  push:
    paths:
      - 'plugins/**'
      - 'skins/**'
      - 'tools/**'
      - 'system_images/**'
      - 'novaler/**'
      - 'picons/**'
      - 'channels/**'
      
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate and Beautify index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python generate_index.py
          python beautify_index.py

      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/index.json feed/metadata_store.json
          git commit -m "Auto-update json index and metadata" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
